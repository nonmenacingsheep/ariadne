<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="desk.css">
</head><body>
<div id="wires"></div>
<div id="widgets"></div>
<canvas id="front"></canvas>
<script>
// Script errors go to the desk's log (layer.py), where they can be seen.
addEventListener("error", e => { try { window.webkit.messageHandlers.desk.postMessage(JSON.stringify({ t: "log", msg: `${e.message} @ ${(e.filename || "").split("/").pop()}:${e.lineno}` })); } catch (_) {} });
addEventListener("unhandledrejection", e => { try { window.webkit.messageHandlers.desk.postMessage(JSON.stringify({ t: "log", msg: "promise: " + e.reason })); } catch (_) {} });
</script>
<script src="sounds.js"></script>
<script src="spotify.js"></script>
<script src="apps.js"></script>
<script src="flows.js"></script>
<script src="desk.js"></script>
</body></html>
